name: Deploy to PythonAnywhere & Auto-Extend

on:
  push:
    branches: [ main ]
  schedule:
    # Runs at 00:00 on the 1st and 15th of every month to keep the web app alive
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Reload PythonAnywhere Web App
        run: |
          echo "Triggering PythonAnywhere web app reload..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Token ${{ secrets.PA_API_TOKEN }}" \
            "https://www.pythonanywhere.com/api/v0/user/${{ secrets.PA_USERNAME }}/webapps/${{ secrets.PA_DOMAIN }}/reload/")

          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 201 ]; then
            echo "Successfully reloaded ${{ secrets.PA_DOMAIN }}!"
          else
            echo "Failed to reload! HTTP Status: $HTTP_STATUS"
            echo "Response: $HTTP_BODY"
            exit 1
          fi
